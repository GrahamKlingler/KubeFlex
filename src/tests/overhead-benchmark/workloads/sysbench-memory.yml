apiVersion: v1
kind: Pod
metadata:
  name: sysbench-memory-pod
  namespace: test-namespace
  labels:
    name: sysbench-memory-pod
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: kind-worker
  containers:
  - name: test-container
    image: grahamklingler26/sysbench-testpod:latest
    imagePullPolicy: IfNotPresent
    command: ["/usr/bin/tini", "--"]
    args: ["/bin/bash", "-c", "sysbench memory --memory-block-size=1K --memory-total-size=1000G --time=0 run"]
    securityContext:
      privileged: true
      capabilities:
        add:
        - SYS_PTRACE
        - SYS_RESOURCE
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_TIME
        - CHECKPOINT_RESTORE
        - SYS_CHROOT
        - SETPCAP
        - SETGID
        - SETUID
      seccompProfile:
        type: Unconfined
      allowPrivilegeEscalation: true
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "1000m"
    volumeMounts:
    - name: checkpoint-volume
      mountPath: /tmp/checkpoints
    - name: script-data
      mountPath: /script-data
  volumes:
  - name: checkpoint-volume
    hostPath:
      path: /tmp/checkpoints
      type: Directory
  - name: script-data
    emptyDir: {}
